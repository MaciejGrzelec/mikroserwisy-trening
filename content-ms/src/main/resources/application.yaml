server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: content-ms-route
              uri: lb://CONTENT-MS
              predicates:
                - Path=/api/content/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
