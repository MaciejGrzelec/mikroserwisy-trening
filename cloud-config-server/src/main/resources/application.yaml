spring:
  application:
    name: cloud-config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/MaciejGrzelec/crypto-config-repo.git
#          default-label określa nazwę brancha na github
          default-label: prod
#          defaultowo konfiguracja z git ładowana jest lazy. Clone true wywala apke przy starcie jak nie ma config
          clone-on-start: true
#          username:
#          password:

server:
  port: 8888

management:
  endpoints:
    web:
      exposure:
        include: health,info